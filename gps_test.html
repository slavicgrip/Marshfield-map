  /* Non-blocking overlay container so map clicks pass right through */
#nyan-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
}

/* Non-blocking overlay container */
#nyan-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
}

.nyan-wrapper {
  position: absolute;
  display: flex;
  align-items: center;
  left: 0;
  top: 0;
  will-change: transform;
}

/* Trailing 6-color rainbow */
.nyan-rainbow {
  width: 160px;
  height: 36px;
  background: linear-gradient(
    to bottom,
    #ff0000 0%,     #ff0000 16.66%,
    #ff9900 16.66%, #ff9900 33.33%,
    #ffff00 33.33%, #ffff00 50%,
    #33ff00 50%,    #33ff00 66.66%,
    #0099ff 66.66%, #0099ff 83.33%,
    #6633ff 83.33%, #6633ff 100%
  );
  border-radius: 4px 0 0 4px;
  mask-image: linear-gradient(to right, transparent 0%, black 40%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 40%);
  animation: rainbow-wave 0.3s infinite alternate ease-in-out;
}

/* Pop-Tart Cat SVG bounce */
.nyan-cat {
  width: 54px;
  height: 38px;
  margin-left: -6px;
  animation: cat-bounce 0.25s infinite alternate ease-in-out;
}

@keyframes cat-bounce {
  0% { transform: translateY(-2px); }
  100% { transform: translateY(2px); }
}

@keyframes rainbow-wave {
  0% { transform: translateY(1px); }
  100% { transform: translateY(-1px); }
}

	// Wait for the HTML body to fully load before trying to append elements
  document.addEventListener("DOMContentLoaded", function() {
  const nyanOverlay = document.createElement('div');
  nyanOverlay.id = 'nyan-overlay';
  document.body.appendChild(nyanOverlay);

  const nyanCatSVG = `
  <svg class="nyan-cat" viewBox="0 0 34 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <!-- Tail & Paws -->
    <rect x="1" y="13" width="4" height="3" fill="#999999"/>
    <rect x="6" y="19" width="3" height="3" fill="#999999"/>
    <rect x="11" y="19" width="3" height="3" fill="#999999"/>
    <rect x="20" y="19" width="3" height="3" fill="#999999"/>
    <rect x="25" y="19" width="3" height="3" fill="#999999"/>
    <!-- Pop-Tart Pastry -->
    <rect x="5" y="3" width="20" height="16" fill="#ffcc99" stroke="#000" stroke-width="1"/>
    <!-- Pink Frosting -->
    <rect x="7" y="5" width="16" height="12" fill="#ff99ff"/>
    <!-- Sprinkles -->
    <rect x="9" y="7" width="1" height="1" fill="#ff3399"/>
    <rect x="14" y="6" width="1" height="1" fill="#ff3399"/>
    <rect x="11" y="11" width="1" height="1" fill="#ff3399"/>
    <rect x="16" y="13" width="1" height="1" fill="#ff3399"/>
    <rect x="9" y="14" width="1" height="1" fill="#ff3399"/>
    <!-- Cat Head -->
    <rect x="20" y="8" width="11" height="9" fill="#999999" stroke="#000" stroke-width="1"/>
    <!-- Ears -->
    <rect x="20" y="5" width="3" height="3" fill="#999999" stroke="#000" stroke-width="1"/>
    <rect x="28" y="5" width="3" height="3" fill="#999999" stroke="#000" stroke-width="1"/>
    <!-- Eyes & Cheeks -->
    <rect x="22" y="11" width="2" height="2" fill="#000000"/>
    <rect x="28" y="11" width="2" height="2" fill="#000000"/>
    <rect x="21" y="13" width="2" height="2" fill="#ff9999"/>
    <rect x="29" y="13" width="2" height="2" fill="#ff9999"/>
    <!-- Mouth -->
    <rect x="24" y="14" width="4" height="1" fill="#000000"/>
  </svg>`;

  function spawnNyanCat() {
    const wrapper = document.createElement('div');
    wrapper.className = 'nyan-wrapper';
    wrapper.innerHTML = `<div class="nyan-rainbow"></div>${nyanCatSVG}`;
    nyanOverlay.appendChild(wrapper);

    let currentX = -250;
    const startY = Math.random() * (window.innerHeight * 0.5) + (window.innerHeight * 0.25);
    const speed = Math.random() * 1.5 + 2.5; // Horizontal speed
    const amplitude = Math.random() * 60 + 50; // Wave height (pixels up/down from center)
    const frequency = 0.008; // Wave frequency (how stretched out the waves are)

    function frame() {
      currentX += speed;
      
      // True mathematical sine wave formula
      const currentY = startY + amplitude * Math.sin(currentX * frequency);
      
      // Calculate angle dynamically based on the slope (derivative) of the sine wave
      const derivative = amplitude * frequency * Math.cos(currentX * frequency);
      const angle = Math.atan(derivative) * (180 / Math.PI); // Convert radians to degrees

      wrapper.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${angle}deg)`;

      // Continue animating until it clears the right side of the screen
      if (currentX < window.innerWidth + 300) {
        requestAnimationFrame(frame);
      } else {
        wrapper.remove();
      }
    }

    requestAnimationFrame(frame);
  }

  function scheduleNextNyan() {
    const randomDelay = Math.random() * 30000 + 15000;
    setTimeout(() => {
      spawnNyanCat();
      scheduleNextNyan();
    }, randomDelay);
  }

  // Test run 2 seconds after load
  setTimeout(spawnNyanCat, 2000);
  scheduleNextNyan();
});
	
  </script>

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function isWithinAllowedGeofences(lat, lng) {
      if (!currentUserProfile || !currentUserProfile.allowedGeofences || currentUserProfile.allowedGeofences.length === 0) {
        return true;
      }
      
      const strictFences = currentUserProfile.allowedGeofences.filter(fence => {
        const radius = fence.radiusMeters || fence.radius;
        return radius != null && Number(radius) > 0;
      });

      if (strictFences.length === 0) {
        return true; 
      }

      for (const fence of strictFences) {
        const loc = fence.location || fence.geopoint || fence.coords || fence.point || fence;
        const centerLat = loc.latitude ?? loc.lat;
        const centerLng = loc.longitude ?? loc.lng;
        const radius = fence.radiusMeters || fence.radius;

        if (centerLat == null || centerLng == null) continue;

        if (getDistanceMeters(centerLat, centerLng, lat, lng) <= radius) {
          return true;
        }
      }

      return false;
    }

          <circle cx="12" cy="11" r="4.5" fill="#ffffff"/>
        </svg>`;

      return L.divIcon({
        className: 'custom-svg-pin',
        html: svg,
        iconSize: [30, 45],
        iconAnchor: [15, 45],

 });

    // Dynamic View-Based Parcel Container Layer (Restricted by distance & zoom to prevent crashes)
    const wiParcelsLayer = L.layerGroup();
    let parcelFetchTimeout = null;

    function fetchParcelsForCurrentView() {
      if (map.getZoom() < 19) {
        wiParcelsLayer.clearLayers();
        return;
      }

      const bounds = map.getBounds();
      const southWest = bounds.getSouthWest();
      const northEast = bounds.getNorthEast();

      const viewWidthMeters = getDistanceMeters(
        southWest.lat, southWest.lng,
        southWest.lat, northEast.lng
      );

      const MAX_VIEW_DISTANCE_METERS = 1000;

      if (viewWidthMeters > MAX_VIEW_DISTANCE_METERS) {
        wiParcelsLayer.clearLayers();
        return;
      }

      clearTimeout(parcelFetchTimeout);
      parcelFetchTimeout = setTimeout(() => {
        if (!map.hasLayer(wiParcelsLayer)) return;

        const bbox = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
        const queryUrl = `https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query?geometry=${bbox}&geometryType=esriGeometryEnvelope&spatialRel=esriSpatialRelIntersects&outFields=*&f=geojson`;

        fetch(queryUrl)
          .then(response => response.json())
          .then(data => {
            wiParcelsLayer.clearLayers();
            if (!data.features) return;

            const geoJsonGroup = L.geoJSON(data, {
              style: function () {
                return {
                  color: '#e67e22',
                  weight: 1.5,
                  fillColor: '#34495e',
                  fillOpacity: 0.05
                };
              },
              onEachFeature: function (feature, layer) {
                const props = feature.properties || {};
                const address = props.SITEADRESS || props.FullPhysicalAddress || props.address || 'N/A';
                const parcelId = props.PARCELID || props.ParcelID || 'N/A';
                const owner = props.OWNERNME1 || props.PrimaryOwnerName || 'N/A';

                layer.bindPopup(`
                  <div style="font-size: 12px;">
                    <strong>WI Tax Parcel (V12)</strong><br><hr style="margin: 4px 0;">
                    <b>Address:</b> ${address}<br>
                    <b>Parcel ID:</b> ${parcelId}<br>
                    <b>Owner:</b> ${owner}
                  </div>
                `);

                if (address && address !== 'N/A') {
                  layer.bindTooltip(address, {
                    permanent: true,
                    direction: 'center',
                    className: 'parcel-address-label'
                  });
                }
              }
            });

            wiParcelsLayer.addLayer(geoJsonGroup);
          })
          .catch(err => console.error("Parcel fetch error:", err));
      }, 400);
    }

    // Public City of Marshfield Address & Street Name Annotations
    const addressLabelsLayer = L.esri.dynamicMapLayer({

    // Safe, Built-in Distance Measurement Tool Control
    let isMeasuring = false;

    const MeasureControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function (map) {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        const button = L.DomUtil.create('a', 'leaflet-control-measure-btn', container);
        button.innerHTML = '📏';

        button.style.lineHeight = '34px';
        button.style.textAlign = 'center';
        button.style.backgroundColor = 'white';
        button.style.width = '34px';
        button.style.height = '34px';
        button.style.display = 'block';

        L.DomEvent.disableClickPropagation(container);

        button.onclick = function (e) {
          e.preventDefault();
          isMeasuring = !isMeasuring;

          if (isMeasuring) {
            button.style.backgroundColor = '#2ecc71';
            map.getContainer().style.cursor = 'crosshair';
          } else {
            resetMeasurement();
          }
        };
        return container;
      }
    });

    map.addControl(new MeasureControl());

    function resetMeasurement() {
      isMeasuring = false;
      measurePoints = [];
      if (measureLine) map.removeLayer(measureLine);
      if (measureTooltip) map.removeLayer(measureTooltip);
      measureLine = null;
      measureTooltip = null;
      map.getContainer().style.cursor = '';
      const btn = document.querySelector('.leaflet-control-measure-btn');
      if (btn) btn.style.backgroundColor = 'white';
    }

    map.on('click', function (e) {
      if (!isMeasuring) return;

      measurePoints.push(e.latlng);

      if (measurePoints.length === 1) {
        measureLine = L.polyline(measurePoints, { color: '#e74c3c', weight: 3, dashArray: '5, 10' }).addTo(map);
      } else {
        measureLine.setLatLngs(measurePoints);

        let totalDistanceMeters = 0;
        for (let i = 0; i < measurePoints.length - 1; i++) {
          totalDistanceMeters += measurePoints[i].distanceTo(measurePoints[i + 1]);
        }
        const feet = (totalDistanceMeters * 3.28084).toFixed(1);
        const miles = (totalDistanceMeters * 0.000621371).toFixed(2);

        const labelText = feet > 5280 ? `${miles} mi (${feet} ft)` : `${feet} ft`;

        if (!measureTooltip) {
          measureTooltip = L.tooltip({ permanent: true, direction: 'top', className: 'parcel-address-label' })
            .setLatLng(e.latlng)
            .addTo(map);
        }
        measureTooltip.setLatLng(e.latlng).setContent(`<b>Distance:</b> ${labelText}`);
      }
    });

    map.on('dblclick', function () {

    const ResetViewControl = L.Control.extend({

    const searchInput = document.getElementById("map-search-box");

    if (searchInput) {
      searchInput.addEventListener("input", function() {
        clearTimeout(searchDebounceTimeout);
        const query = searchInput.value.trim();

        if (query.length < 2) {
          searchResults.style.display = "none";
          searchResults.innerHTML = "";
          return;
        }

        searchDebounceTimeout = setTimeout(() => { performAddressSearch(query); }, 300);
      });
    }

    async function performAddressSearch(query) {
      searchResults.innerHTML = `<div class="search-result-item" style="color: #777;">Searching addresses...</div>`;
      searchResults.style.display = "block";

      try {
        const center = map.getCenter();
        const geocodeUrl = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&singleLine=${encodeURIComponent(query)}&maxLocations=6&location=${center.lng},${center.lat}`;

        const response = await fetch(geocodeUrl);
        const data = await response.json();

        if (data.candidates && data.candidates.length > 0) {
          searchResults.innerHTML = "";
          
          data.candidates.forEach(candidate => {
            const lat = candidate.location.y;
            const lon = candidate.location.x;
            const name = candidate.address;
            
            const item = document.createElement("div");
            item.className = "search-result-item";
            item.innerHTML = `🔍 ${escapeHtml(name)}`;
            item.onclick = () => selectAddressResult(lat, lon, name);
            searchResults.appendChild(item);
          });
        } else {
          searchResults.innerHTML = `<div class="search-result-item" style="color: #777;">No matching addresses found.</div>`;
        }
      } catch (err) {
        console.error("Geocoding error:", err);
        searchResults.innerHTML = `<div class="search-result-item" style="color: #777;">Error searching addresses.</div>`;
      }
    }

    function selectAddressResult(lat, lon, displayName) {
      searchResults.style.display = "none";
      if (searchInput) searchInput.value = displayName.split(',')[0];
      map.setView([lat, lon], 17, { animate: true });

      if (searchResultMarker) map.removeLayer(searchResultMarker);

      searchResultMarker = L.marker([lat, lon], { icon: markerIcons.purple })
        .addTo(map)
        .bindPopup(`<b>Search Location</b><br>${escapeHtml(displayName)}`, { closeButton: false })
        .openPopup();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // REAL-TIME FIRESTORE SYNC
    db.collection("marshfield_pins").onSnapshot(function(snapshot) {
      var statusDot = document.getElementById("status-dot");
      if (statusDot) statusDot.classList.add("online");

      snapshot.docChanges().forEach(function(change) {
        var id = change.doc.id;
        var data = change.doc.data();

        if (change.type === "added" || change.type === "modified") {
          renderPinMarker(id, data);
        }
        if (change.type === "removed" && activeMarkers[id]) {
          markerClusterGroup.removeLayer(activeMarkers[id].marker);
          if (activeMarkers[id].polygon) map.removeLayer(activeMarkers[id].polygon);
          delete activeMarkers[id];
        }
      });
    }, function(error) {
      console.error("Firestore sync error:", error);
    });

    function renderPinMarker(id, data) {
      var currentUser = auth.currentUser;
      var isOwner = currentUser && data.userId === currentUser.uid;
      var isSuperAdmin = typeof currentUserProfile !== 'undefined' && currentUserProfile && currentUserProfile.role === "super_admin";
      
      var pinLat = data.lat ?? data.latitude;
      var pinLng = data.lng ?? data.longitude;
      var isGeofenceAllowed = typeof isWithinAllowedGeofences === 'function' && isWithinAllowedGeofences(pinLat, pinLng);
      
      var canEditPin = currentUser && (isOwner || isSuperAdmin || isGeofenceAllowed);

      var pinColor = data.color && markerIcons[data.color] ? data.color : 'purple';
      var chosenIcon = markerIcons[pinColor];
      var isDraggable = !!canEditPin;

      var entry = activeMarkers[id];

      if (!entry) {
        var marker = L.marker([pinLat, pinLng], { 
          icon: chosenIcon,
          draggable: isDraggable
        });

        marker.on('dragstart', function() {
          markerClusterGroup.removeLayer(marker);
          marker.addTo(map);
        });

        marker.on('dragend', async function(e) {
          var newLatLng = e.target.getLatLng();
          map.removeLayer(marker);
          markerClusterGroup.addLayer(marker);

          if (!isWithinAllowedGeofences(newLatLng.lat, newLatLng.lng)) {
            alert("Action blocked: This location is outside your allowed editing geofence.");
            e.target.setLatLng([pinLat, pinLng]);
            return;
          }

          try {
            await db.collection("marshfield_pins").doc(id).update({
              lat: newLatLng.lat,
              lng: newLatLng.lng,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } catch (err) {
            alert("Error updating position: " + err.message);
            e.target.setLatLng([pinLat, pinLng]);
          }
        });
		
        var polygonLayer = null;
        if (data.polygonCoords && Array.isArray(data.polygonCoords) && data.polygonCoords.length > 0) {
          var leafletCoords = data.polygonCoords.map(pt => Array.isArray(pt) ? pt : [pt.lat, pt.lng]);

          polygonLayer = L.polygon(leafletCoords, {
            color: colorHexMap[pinColor] || '#8e44ad',
            fillColor: colorHexMap[pinColor] || '#9b59b6',
            fillOpacity: 0.3,
            weight: 2
          }).addTo(map);
          polygonLayer.on('click', function() { marker.openPopup(); });
        }

        entry = { marker: marker, polygon: polygonLayer, data: data };
        activeMarkers[id] = entry;
        markerClusterGroup.addLayer(marker);
      } else {
        entry.data = data;
        entry.marker.setIcon(chosenIcon);
        entry.marker.setLatLng([pinLat, pinLng]);

        if (entry.polygon) {
          map.removeLayer(entry.polygon);
          entry.polygon = null;
        }
        if (data.polygonCoords && Array.isArray(data.polygonCoords) && data.polygonCoords.length > 0) {
          var polygonLayer = L.polygon(data.polygonCoords, {
            color: colorHexMap[pinColor] || '#8e44ad',
            fillColor: colorHexMap[pinColor] || '#9b59b6',
            fillOpacity: 0.3,
            weight: 2
          }).addTo(map);
          polygonLayer.on('click', function() { entry.marker.openPopup(); });
          entry.polygon = polygonLayer;
        }
      }

      if (entry.marker.dragging) {
        isDraggable ? entry.marker.dragging.enable() : entry.marker.dragging.disable();
      }

      var images = data.imageUrls || (data.imageUrl ? [data.imageUrl] : []);
      var imageGalleryHtml = "";
      if (images.length > 0) {
        var encodedImages = encodeURIComponent(JSON.stringify(images));
        imageGalleryHtml = '<div class="image-gallery">' + 
          images.map(function(url, idx) {
            var deleteBtn = canEditPin ? '<button type="button" class="delete-img-btn" onclick="removePinImage(\'' + id + '\',' + idx + ')" title="Remove photo">✕</button>' : '';
            return '<div class="image-thumb-container"><img src="' + url + '" alt="photo" onclick="openLightbox(\'' + encodedImages + '\', ' + idx + ')" style="cursor: pointer;">' + deleteBtn + '</div>';
          }).join('') + '</div>';
      }

      var editDeleteBtns = canEditPin ? '<div class="pin-actions"><button onclick="openEditModal(\'' + id + '\')">Edit Pin</button><button onclick="deletePin(\'' + id + '\')">Delete Pin</button></div>' : '';
      var popupContent = '<div class="pin-popup"><h3>' + (data.title || 'Marshfield Pin') + '</h3><p>' + (data.description || data.note || '') + '</p>' + imageGalleryHtml + editDeleteBtns + '</div>';
      entry.marker.bindPopup(popupContent);

      var tooltipTitle = data.title && data.title.trim() !== '' ? data.title : 'Untitled Pin';
      if (entry.marker.getTooltip()) {
        entry.marker.setTooltipContent(tooltipTitle);
      } else {
        entry.marker.bindTooltip(tooltipTitle, { direction: 'top', offset: [0, -40], opacity: 0.9 });
      }

      var checkedColors = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(function(cb) { return cb.value; });
      if (checkedColors.includes(pinColor)) {
        if (!markerClusterGroup.hasLayer(entry.marker)) markerClusterGroup.addLayer(entry.marker);
      } else {
        if (markerClusterGroup.hasLayer(entry.marker)) {
          entry.marker.closePopup();
          markerClusterGroup.removeLayer(entry.marker);
        }
      }
    }

    window.openEditModal = function(id) {
      const entry = activeMarkers[id];
      if (!entry || !entry.data) {
        alert("Could not load pin data for editing.");
        return;
      }
      
      const pinData = entry.data;

      const idField = document.getElementById("edit-pin-id");
      const titleField = document.getElementById("edit-title");
      const noteField = document.getElementById("edit-note");
      const colorField = document.getElementById("edit-color");
      
      if (idField) idField.value = id;
      if (titleField) titleField.value = pinData.title || "";
      if (noteField) noteField.value = pinData.note || pinData.description || "";
      if (colorField) colorField.value = pinData.color || "purple";

      const previewContainer = document.getElementById("edit-photo-preview");
      if (previewContainer) {
        const urls = pinData.imageUrls || (pinData.imageUrl ? [pinData.imageUrl] : []);
        if (urls.length === 0) {
          previewContainer.innerHTML = '<span style="font-size: 12px; color: #888;">No photos attached.</span>';
        } else {
          previewContainer.innerHTML = urls.map((url, index) => `

    let currentLightboxImages = [];
    let currentLightboxIndex = 0;
    let currentZoom = 1;
    let panX = 0;
    let panY = 0;
    
    let isDragging = false;
    let hasDragged = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDistance = null;
    let baseZoom = 1;

    window.openLightbox = function(encodedImages, index) {
      currentLightboxImages = JSON.parse(decodeURIComponent(encodedImages));
      currentLightboxIndex = index;
      resetZoom();
      updateLightboxView();
      document.getElementById("lightbox-modal").style.display = "flex";
    };

    window.closeLightbox = function() {
      document.getElementById("lightbox-modal").style.display = "none";
      resetZoom();
    };

    window.changeLightboxImage = function(direction) {
      currentLightboxIndex += direction;
      if (currentLightboxIndex < 0) {
        currentLightboxIndex = currentLightboxImages.length - 1;
      } else if (currentLightboxIndex >= currentLightboxImages.length) {
        currentLightboxIndex = 0;
      }
      resetZoom();
      updateLightboxView();
    };

    window.jumpToLightboxImage = function(index) {
      currentLightboxIndex = index;
      resetZoom();
      updateLightboxView();
    };

    function resetZoom() {
      currentZoom = 1;
      panX = 0;
      panY = 0;
      const imgEl = document.getElementById("lightbox-img");
      if (imgEl) {
        imgEl.style.transform = `translate(0px, 0px) scale(1)`;
        imgEl.style.cursor = "zoom-in";
      }
    }

    function updateLightboxView() {
      const imgEl = document.getElementById("lightbox-img");
      const counterEl = document.getElementById("lightbox-counter");
      const thumbsEl = document.getElementById("lightbox-thumbnails");

      if (imgEl && currentLightboxImages.length > 0) {
        imgEl.src = currentLightboxImages[currentLightboxIndex];
      }
      if (counterEl) {
        counterEl.innerText = `Photo ${currentLightboxIndex + 1} of ${currentLightboxImages.length}`;
      }
      if (thumbsEl) {
        if (!thumbsEl.dataset.initialized || thumbsEl.dataset.count !== String(currentLightboxImages.length)) {
          thumbsEl.dataset.initialized = "true";
          thumbsEl.dataset.count = currentLightboxImages.length;
          thumbsEl.innerHTML = currentLightboxImages.map((url, idx) => {
            return `<img src="${url}" onclick="jumpToLightboxImage(${idx})" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px; cursor: pointer; transition: all 0.2s;">`;
          }).join('');
        }

        const thumbImgs = thumbsEl.querySelectorAll("img");
        thumbImgs.forEach((thumb, idx) => {
          if (idx === currentLightboxIndex) {
            thumb.style.border = "2px solid #3498db";
            thumb.style.opacity = "1";
            thumb.style.transform = "scale(1.05)";
          } else {
            thumb.style.border = "1px solid #555";
            thumb.style.opacity = "0.6";
            thumb.style.transform = "scale(1)";
          }
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const imgEl = document.getElementById("lightbox-img");
      if (!imgEl) return;

      imgEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomIntensity = 0.15;
        if (e.deltaY < 0) {
          currentZoom = Math.min(currentZoom + zoomIntensity, 4);
        } else {
          currentZoom = Math.max(currentZoom - zoomIntensity, 1);
        }
        applyTransform(imgEl);
      }, { passive: false });

      imgEl.addEventListener("click", () => {
        if (hasDragged) {
          hasDragged = false; 
          return;
        }
        if (currentZoom === 1) {
          currentZoom = 2.5;
        } else {
          resetZoom();
        }
        applyTransform(imgEl);
      });

      imgEl.addEventListener("mousedown", (e) => {
        if (currentZoom > 1) {
          isDragging = true;
          hasDragged = false;
          startX = e.clientX - panX;
          startY = e.clientY - panY;
          imgEl.style.cursor = "grabbing";
          e.preventDefault();
        }
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        hasDragged = true;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform(imgEl);
      });

      window.addEventListener("mouseup", () => {
        if (isDragging) {
          isDragging = false;
          if (currentZoom > 1) imgEl.style.cursor = "grab";
        }
      });

      let touchStartX = 0;
      let touchStartY = 0;

      imgEl.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          
          if (currentZoom > 1) {
            isDragging = true;
            startX = touchStartX - panX;
            startY = touchStartY - panY;
          }
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
          baseZoom = currentZoom;
        }
      }, { passive: true });

      imgEl.addEventListener("touchmove", (e) => {
        if (isDragging && e.touches.length === 1 && currentZoom > 1) {
          hasDragged = true;
          panX = e.touches[0].clientX - startX;
          panY = e.touches[0].clientY - startY;
          applyTransform(imgEl);
        } else if (e.touches.length === 2 && initialPinchDistance !== null) {
          hasDragged = true;
          const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
          const scaleFactor = currentDistance / initialPinchDistance;
          currentZoom = Math.min(Math.max(baseZoom * scaleFactor, 1), 4);
          applyTransform(imgEl);
        }
      }, { passive: true });

      imgEl.addEventListener("touchend", (e) => {
        if (currentZoom === 1 && e.changedTouches.length === 1) {
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
          const diffX = touchEndX - touchStartX;
          const diffY = touchEndY - touchStartY;

          if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX < 0) {
              changeLightboxImage(1);
            } else {
              changeLightboxImage(-1);
            }
          }
        }

        isDragging = false;
        initialPinchDistance = null;
        if (currentZoom === 1) {
          panX = 0;
          panY = 0;
        }
      });
	  
      window.addEventListener("keydown", (e) => {
        const modal = document.getElementById("lightbox-modal");
        if (!modal) return;

        const computedDisplay = window.getComputedStyle(modal).display;
        if (computedDisplay === "none" || computedDisplay === "") return;

        if (e.key === "Escape" || e.key === "Esc") {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          closeLightbox();
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          changeLightboxImage(1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          changeLightboxImage(-1);
        }
      }, true);
    });

    function getTouchDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function applyTransform(imgEl) {
      if (currentZoom === 1) {
        panX = 0;
        panY = 0;
        imgEl.style.cursor = "zoom-in";
      } else {
        imgEl.style.cursor = "grab";
      }
      imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
    }

    // Helper to read EXIF GPS metadata from an uploaded file
    function getFileGPS(file) {
      return new Promise((resolve) => {
        EXIF.getData(file, function() {
          const latTag = EXIF.getTag(this, "GPSLatitude");
          const latRef = EXIF.getTag(this, "GPSLatitudeRef");
          const lngTag = EXIF.getTag(this, "GPSLongitude");
          const lngRef = EXIF.getTag(this, "GPSLongitudeRef");

          if (!latTag || !lngTag) {
            resolve(null);
            return;
          }

          const convertToDecimal = (dms, ref) => {
            let decimal = dms[0] + dms[1] / 60 + dms[2] / 3600;
            if (ref === "S" || ref === "W") decimal *= -1;
            return decimal;
          };

          resolve({
            lat: convertToDecimal(latTag, latRef),
            lng: convertToDecimal(lngTag, lngRef)
          });
        });
      });
    }

    window.uploadPhotos = async function(pinId, files) {
      if (!files || files.length === 0) return;

      const statusEl = document.getElementById(`upload-status-${pinId}`) || document.getElementById("upload-status-modal");
      if (statusEl) {
        statusEl.style.display = "block";
        statusEl.innerText = `Processing and uploading ${files.length} image(s)...`;
      }

      try {
        const uploadedUrls = [];
        let updatedLat = null;
        let updatedLng = null;

        for (let file of files) {
          if (file.size > 10 * 1024 * 1024) continue;

          // Extract EXIF GPS metadata if present
          const gps = await getFileGPS(file);
          if (gps) {
            updatedLat = gps.lat;
            updatedLng = gps.lng;
          }

          const fileRef = storage.ref().child(`pins/${pinId}/${Date.now()}_${file.name}`);
          const snapshot = await fileRef.put(file);
          const downloadUrl = await snapshot.ref.getDownloadURL();
          uploadedUrls.push(downloadUrl);
        }

        if (uploadedUrls.length > 0) {
          const docRef = db.collection("marshfield_pins").doc(pinId);
          const docSnap = await docRef.get();
          const existingData = docSnap.data();
          const currentUrls = existingData.imageUrls || (existingData.imageUrl ? [existingData.imageUrl] : []);

          const updatePayload = {
            imageUrls: [...currentUrls, ...uploadedUrls],
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          // Update pin position and auto-generate polygon boundary if EXIF GPS data is found
          if (updatedLat !== null && updatedLng !== null) {
            updatePayload.lat = updatedLat;
            updatePayload.lng = updatedLng;

            if (!existingData.polygonCoords || existingData.polygonCoords.length === 0) {
              const offset = 0.0002; // ~20 meter bounding box
              updatePayload.polygonCoords = [
                { lat: updatedLat + offset, lng: updatedLng - offset },
                { lat: updatedLat + offset, lng: updatedLng + offset },
                { lat: updatedLat - offset, lng: updatedLng + offset },
                { lat: updatedLat - offset, lng: updatedLng - offset }
              ];
            }
          }

          await docRef.update(updatePayload);
        }
      } catch (err) {
        alert("Photo upload failed: " + err.message);
      } finally {
        if (statusEl) statusEl.style.display = "none";
      }
    };

    window.removePinImage = async function(pinId, indexToRemove) {

        const data = docSnap.data();
        let urls = data.imageUrls || (data.imageUrl ? [data.imageUrl] : []);

        urls.splice(indexToRemove, 1);

        await docRef.update({
          imageUrls: urls,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        alert("Error removing image: " + err.message);

      const center = map.getCenter();

      try {
        const userRef = db.collection("users").doc(currentUser.uid);
        const newLocation = {
          name: name.trim(),
          location: new firebase.firestore.GeoPoint(center.lat, center.lng),
          radiusMeters: null 
        };

        await userRef.set({
          allowedGeofences: firebase.firestore.FieldValue.arrayUnion(newLocation)
        }, { merge: true });

          currentUserProfile = {};

        });

        currentUserProfile.allowedGeofences = updatedZones;

    function updateZonesPanelUI() {
      const zonesPanel = document.getElementById("zones-panel");
      const zonesList = document.getElementById("zones-list");
      if (!zonesList) return;
      geofenceLayerGroup.clearLayers();

      const userZones = currentUserProfile?.allowedGeofences;

      if (userZones && userZones.length > 0) {
        zonesList.innerHTML = "";
        
        userZones.forEach((zone, index) => {
          const loc = zone.location || zone.geopoint || zone.coords || zone.point || zone;
          const lat = loc.latitude ?? loc.lat;
          const lng = loc.longitude ?? loc.lng;
          const radius = zone.radiusMeters || zone.radius;
          const name = zone.name || `Location ${index + 1}`;

          if (lat != null && lng != null) {
            const row = document.createElement("div");
            row.className = "zone-row";

            const btn = document.createElement("button");

            const renameBtn = document.createElement("button");
            renameBtn.type = "button";
            renameBtn.className = "zone-rename-btn";
            renameBtn.innerHTML = "✏️";
            renameBtn.title = "Rename location";
            renameBtn.style.background = "none";
            renameBtn.style.border = "none";
            renameBtn.style.cursor = "pointer";
            renameBtn.style.padding = "0 4px";
            renameBtn.onclick = (e) => {
              e.stopPropagation();
              renameUserLocation(index, name);
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "zone-delete-btn";
            deleteBtn.innerHTML = "✕";
            deleteBtn.title = "Remove location";
            deleteBtn.onclick = () => removeUserLocation(index);

            row.appendChild(btn);
            row.appendChild(renameBtn);
            row.appendChild(deleteBtn);
            zonesList.appendChild(row);

            if (radius != null && radius > 0) {
              L.circle([lat, lng], {
                radius: radius,
                color: '#3498db',
                fillColor: '#3498db',
                fillOpacity: 0.1,
                weight: 2
              }).bindTooltip(name).addTo(geofenceLayerGroup);
            }
          }
        });

        zonesPanel.style.display = "block";
      } else {
        zonesList.innerHTML = `<div style="font-size:11px; color:#777; text-align:center; padding:4px;">No saved locations</div>`;
        zonesPanel.style.display = currentUser ? "block" : "none"; 
      }
    }

      currentUser = user;
      const authBtn = document.getElementById("auth-btn");
      if (authBtn) {
        authBtn.innerText = user ? "Account" : "Login";
        authBtn.onclick = user ? window.openAccountMenuModal : window.openLoginChoiceModal;
      }

      if (user) {
        try {
          const userDoc = await db.collection("users").doc(user.uid).get();
          if (userDoc.exists) {
            currentUserProfile = userDoc.data();
            updateZonesPanelUI();

            const firstZone = currentUserProfile.allowedGeofences?.[0];
            if (firstZone) {
              const loc = firstZone.location || firstZone.geopoint || firstZone.coords || firstZone.point || firstZone;
              const lat = loc.latitude ?? loc.lat;
              const lng = loc.longitude ?? loc.lng;
              if (lat != null && lng != null) {
                map.flyTo([lat, lng], 15, { duration: 1.5 });
              }
            }
          } else {
            currentUserProfile = null;
            updateZonesPanelUI();
          }
        } catch (err) {
          console.error("Error fetching user profile:", err);
          currentUserProfile = null;
          updateZonesPanelUI();
        }
      } else {
        currentUserProfile = null;
        updateZonesPanelUI();
      }

      Object.keys(activeMarkers).forEach(id => {
        const { marker, data } = activeMarkers[id];
        renderPinMarker(id, data);
      });
    });

    async function logoutUser() { 
      secureEsriLayers.forEach(layer => {
        map.removeLayer(layer);
      });
      secureEsriLayers = [];

      if (typeof arcgisLayerControl !== 'undefined' && arcgisLayerControl) {
        map.removeControl(arcgisLayerControl);
        arcgisLayerControl = null;
      }

      const arcDot = document.getElementById("arcgis-status-dot");
      if (arcDot) arcDot.style.backgroundColor = "#f39c12";

      await auth.signOut(); 
    }

    async function loginUser() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();
      const rememberMe = document.getElementById("login-remember").checked;

      if (!email || !password) return alert("Enter email and password.");

      try {
        const persistence = rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
        await auth.setPersistence(persistence);
        await auth.signInWithEmailAndPassword(email, password);
        closeLoginModal();
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    }

    window.toggleZonesPanel = function() {
      const panel = document.getElementById("zones-panel");
      panel.classList.toggle("collapsed");
    };

    async function forgotPassword() {
      const emailInput = document.getElementById("login-email");
      let email = emailInput.value.trim();

      if (!email) {
        email = prompt("Please enter your account email address for password reset:");
        if (!email) return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        alert("Password reset email sent! Check your inbox.");
      } catch (err) {
        alert("Error sending password reset email: " + err.message);
      }
    }

    async function generateArcGISToken() {
      const username = document.getElementById("arcgis-user").value.trim();
      const password = document.getElementById("arcgis-pass").value.trim();

      if (!username || !password) {
        alert("Please enter both username and password.");
        return;
      }

      const tokenUrl = "https://www.arcgis.com/sharing/rest/generateToken";

      const params = new URLSearchParams();
      params.append("username", username);
      params.append("password", password);
      params.append("client", "referer");
      params.append("referer", window.location.origin);
      params.append("expiration", 60);
      params.append("f", "json");

      try {
        const response = await fetch(tokenUrl, {
          method: "POST",
          body: params
        });

        const data = await response.json();

        if (data.error) {
          alert("Login failed: " + data.error.message);
          return;
        }

        const token = data.token;
        closeArcGISLoginModal();

        secureEsriLayers.forEach(layer => map.removeLayer(layer));
        secureEsriLayers = [];

        if (arcgisLayerControl) {
          map.removeControl(arcgisLayerControl);
        }

        loadArcGISLayers(token);

      } catch (err) {
        alert("Connection error connecting to ArcGIS server: " + err.message);
      }
    }

    function loadArcGISLayers(token) {
      const utilityOverlays = {};

      myBaseServices.forEach(service => {
        const dynamicLayer = L.esri.dynamicMapLayer({
          url: service.url,
          token: token,
          opacity: 0.85,
          format: "png24",
          minZoom: 16
        });

        secureEsriLayers.push(dynamicLayer);
        utilityOverlays[`🔒 ${service.name}`] = dynamicLayer;
      });

      if (arcgisLayerControl) {
        map.removeControl(arcgisLayerControl);
      }

      arcgisLayerControl = L.control.layers(null, utilityOverlays, { 
        position: 'topright', 
        collapsed: true 
      }).addTo(map);

      const arcDot = document.getElementById("arcgis-status-dot");
      if (arcDot) arcDot.style.backgroundColor = "#2ecc71";

      alert("City ArcGIS secure utility layers loaded successfully! They will appear automatically when you zoom in close.");
    }

    const kmzLayersCache = {
      pbd03: null,
      pbd07: null,
      pbd09: null
    };

    const kmzFilePaths = {
      pbd03: './' + encodeURI('Wausau PBD03.kmz'),
      pbd07: './KMZs/PBD07.kmz',
      pbd09: './KMZs/PBD09.kmz'
    };

    const kmzPanel = document.getElementById('kmz-legend-panel');
    L.DomEvent.disableClickPropagation(kmzPanel);
    L.DomEvent.disableScrollPropagation(kmzPanel);

    function toggleKmzLayers() {
      const checkboxes = document.querySelectorAll('.kmz-checkbox');
      checkboxes.forEach(cb => {
        const layerKey = cb.getAttribute('data-layer');
        
        if (cb.checked) {
          if (!kmzLayersCache[layerKey]) {
            const targetLayer = L.kmzLayer();
            targetLayer.load(kmzFilePaths[layerKey]);
            kmzLayersCache[layerKey] = targetLayer;
            targetLayer.addTo(map);
          } else {
            if (!map.hasLayer(kmzLayersCache[layerKey])) {
              map.addLayer(kmzLayersCache[layerKey]);
            }
          }
        } else {
          if (kmzLayersCache[layerKey] && map.hasLayer(kmzLayersCache[layerKey])) {
            map.removeLayer(kmzLayersCache[layerKey]);
          }
        }
      });
    }

    function toggleKmzCollapse() {
      const content = document.getElementById('kmz-legend-content');
      const title = document.getElementById('kmz-legend-title');
      if (content.style.display === 'none') {
        content.style.display = 'block';
        title.innerHTML = 'Fiber ▾';
      } else {
        content.style.display = 'none';
        title.innerHTML = 'Fiber ▸';
      }
    }

    function toggleAllKmz() {
      const checkboxes = document.querySelectorAll('.kmz-checkbox');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
      });
      toggleKmzLayers();
    }
  </script>
