  <style>

    <div class="legend-content" id="kmz-legend-content" style="display: none;">
      <label class="legend-item"><input type="checkbox" class="kmz-checkbox" data-layer="pbd03" onchange="toggleKmzLayers()"> Wausau PBD03</label>
      <label class="legend-item"><input type="checkbox" class="kmz-checkbox" data-layer="pbd07" onchange="toggleKmzLayers()"> Spencer PBD07</label>

  <script>
    // SINGLE DECLARED INSTANCE
    let secureEsriLayers = [];

    const myBaseServices = [
      { name: "Parcel Info", url: "https://services2.arcgis.com/SZYqn7iYnvAZ1Q4U/ArcGIS/rest/services/Parcel_Info_Online/MapServer" },	
      { name: "Storm Utility", url: "https://services2.arcgis.com/SZYqn7iYnvAZ1Q4U/arcgis/rest/services/Storm_Utility/MapServer" },
      { name: "Sanitary Utility", url: "https://services2.arcgis.com/SZYqn7iYnvAZ1Q4U/arcgis/rest/services/Sanitary_Utility/MapServer" },
      { name: "Traffic & WW", url: "https://services2.arcgis.com/SZYqn7iYnvAZ1Q4U/arcgis/rest/services/Traffic_Controls_and_WW_Utilities/MapServer" }
    ];

    // FIREBASE INITIALIZATION CHECK
    if (!firebase.apps.length) {
      firebase.initializeApp({
        apiKey: "AIzaSyBrAnUfutqF33QJUKwRHXZHk9JRPHDGEr8",
        authDomain: "marshfield-map-b7ff6.firebaseapp.com",
        projectId: "marshfield-map-b7ff6",
        storageBucket: "marshfield-map-b7ff6.firebasestorage.app",
        messagingSenderId: "338193954075",
        appId: "1:338193954075:web:44c9864fb7ea00099b8fbe"
      });
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;
    let currentUserProfile = null;
    let activeMarkers = {}; 
    let searchResultMarker = null;
    let geofenceLayerGroup = L.layerGroup();

    const MARSHFIELD_CENTER = [44.6688, -90.1718];
    const MARSHFIELD_ZOOM = 13;

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const rad = Math.PI / 180;
      const dLat = (lat2 - lat1) * rad;
      const dLon = (lon2 - lon1) * rad;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function isWithinAllowedGeofences(lat, lng) {
      if (!currentUserProfile || !currentUserProfile.allowedGeofences || currentUserProfile.allowedGeofences.length === 0) {
        return true;
      }
      
      const strictFences = currentUserProfile.allowedGeofences.filter(fence => {
        const radius = fence.radiusMeters || fence.radius;
        return radius != null && Number(radius) > 0;
      });

      if (strictFences.length === 0) {
        return true; 
      }

      for (const fence of strictFences) {
        const loc = fence.location || fence.geopoint || fence.coords || fence.point || fence;
        const centerLat = loc.latitude ?? loc.lat;
        const centerLng = loc.longitude ?? loc.lng;
        const radius = fence.radiusMeters || fence.radius;

        if (centerLat == null || centerLng == null) continue;

        if (getDistanceMeters(centerLat, centerLng, lat, lng) <= radius) {
          return true;
        }
      }

      return false;
    }

    const colorHexMap = {
      purple: '#8e44ad', blue: '#2980b9', red: '#c0392b',
      green: '#27ae60', pink: '#e91e63', yellow: '#f39c12'
    };

    function createSvgPinIcon(colorName) {
      const hex = colorHexMap[colorName] || colorHexMap.purple;
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="30" height="45">
          <path fill="${hex}" stroke="#ffffff" stroke-width="1.5" d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12z"/>
          <circle cx="12" cy="11" r="4.5" fill="#ffffff"/>
        </svg>`;

      return L.divIcon({
        className: 'custom-svg-pin',
        html: svg,
        iconSize: [30, 45],
        iconAnchor: [15, 45],
        popupAnchor: [0, -40]
      });
    }

    const markerIcons = {
      purple: createSvgPinIcon('purple'),
      blue: createSvgPinIcon('blue'),
      red: createSvgPinIcon('red'),
      green: createSvgPinIcon('green'),
      pink: createSvgPinIcon('pink'),
      yellow: createSvgPinIcon('yellow')
    };

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 21,
      maxNativeZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 21,
      maxNativeZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    // Dynamic View-Based Parcel Container Layer (Restricted by distance & zoom to prevent crashes)
    const wiParcelsLayer = L.layerGroup();
    let parcelFetchTimeout = null;

    function fetchParcelsForCurrentView() {
      // 1. Zoom level check (must be at least zoom level 16)
      if (map.getZoom() < 16) {
        wiParcelsLayer.clearLayers();
        return;
      }

      const bounds = map.getBounds();
      const southWest = bounds.getSouthWest();
      const northEast = bounds.getNorthEast();

      // 2. Calculate physical distance across the visible map view (West to East)
      const viewWidthMeters = getDistanceMeters(
        southWest.lat, southWest.lng,
        southWest.lat, northEast.lng
      );

      // 3. Restrict loading if the view width exceeds 1000 meters (~0.6 miles)
      const MAX_VIEW_DISTANCE_METERS = 1000;

      if (viewWidthMeters > MAX_VIEW_DISTANCE_METERS) {
        wiParcelsLayer.clearLayers();
        return;
      }

      clearTimeout(parcelFetchTimeout);
      parcelFetchTimeout = setTimeout(() => {
        if (!map.hasLayer(wiParcelsLayer)) return;

        const bbox = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
        const queryUrl = `https://services3.arcgis.com/n6uYoouQZW75n5WI/arcgis/rest/services/Wisconsin_Statewide_Parcels_DB/FeatureServer/0/query?geometry=${bbox}&geometryType=esriGeometryEnvelope&spatialRel=esriSpatialRelIntersects&outFields=*&f=geojson`;

        fetch(queryUrl)
          .then(response => response.json())
          .then(data => {
            wiParcelsLayer.clearLayers();
            if (!data.features) return;

            const geoJsonGroup = L.geoJSON(data, {
              style: function () {
                return {
                  color: '#e67e22',
                  weight: 1.5,
                  fillColor: '#34495e',
                  fillOpacity: 0.05
                };
              },
              onEachFeature: function (feature, layer) {
                const props = feature.properties || {};
                const address = props.SITEADRESS || props.FullPhysicalAddress || props.address || 'N/A';
                const parcelId = props.PARCELID || props.ParcelID || 'N/A';
                const owner = props.OWNERNME1 || props.PrimaryOwnerName || 'N/A';

                layer.bindPopup(`
                  <div style="font-size: 12px;">
                    <strong>WI Tax Parcel (V12)</strong><br><hr style="margin: 4px 0;">
                    <b>Address:</b> ${address}<br>
                    <b>Parcel ID:</b> ${parcelId}<br>
                    <b>Owner:</b> ${owner}
                  </div>
                `);

                if (address && address !== 'N/A') {
                  layer.bindTooltip(address, {
                    permanent: true,
                    direction: 'center',
                    className: 'parcel-address-label'
                  });
                }
              }
            });

            wiParcelsLayer.addLayer(geoJsonGroup);
          })
          .catch(err => console.error("Parcel fetch error:", err));
      }, 400);
    }

    // Public City of Marshfield Address & Street Name Annotations
    const addressLabelsLayer = L.esri.dynamicMapLayer({

    });

    // Safe, Built-in Distance Measurement Tool Control
    let isMeasuring = false;
    let measurePoints = [];
    let measureLine = null;
    let measureTooltip = null;

    const MeasureControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function (map) {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        const button = L.DomUtil.create('a', 'leaflet-control-measure-btn', container);
        button.innerHTML = '📏';
        button.title = 'Measure Distance';
        button.href = '#';
        button.style.fontSize = '16px';
        button.style.lineHeight = '34px';
        button.style.textAlign = 'center';
        button.style.backgroundColor = 'white';
        button.style.width = '34px';
        button.style.height = '34px';
        button.style.display = 'block';

        L.DomEvent.disableClickPropagation(container);

        button.onclick = function (e) {
          e.preventDefault();
          isMeasuring = !isMeasuring;

          if (isMeasuring) {
            button.style.backgroundColor = '#2ecc71';
            map.getContainer().style.cursor = 'crosshair';
          } else {
            resetMeasurement();
          }
        };
        return container;
      }
    });

    map.addControl(new MeasureControl());

    function resetMeasurement() {
      isMeasuring = false;
      measurePoints = [];
      if (measureLine) map.removeLayer(measureLine);
      if (measureTooltip) map.removeLayer(measureTooltip);
      measureLine = null;
      measureTooltip = null;
      map.getContainer().style.cursor = '';
      const btn = document.querySelector('.leaflet-control-measure-btn');
      if (btn) btn.style.backgroundColor = 'white';
    }

    map.on('click', function (e) {
      if (!isMeasuring) return;

      measurePoints.push(e.latlng);

      if (measurePoints.length === 1) {
        measureLine = L.polyline(measurePoints, { color: '#e74c3c', weight: 3, dashArray: '5, 10' }).addTo(map);
      } else {
        measureLine.setLatLngs(measurePoints);

        let totalDistanceMeters = 0;
        for (let i = 0; i < measurePoints.length - 1; i++) {
          totalDistanceMeters += measurePoints[i].distanceTo(measurePoints[i + 1]);
        }
        const feet = (totalDistanceMeters * 3.28084).toFixed(1);
        const miles = (totalDistanceMeters * 0.000621371).toFixed(2);

        const labelText = feet > 5280 ? `${miles} mi (${feet} ft)` : `${feet} ft`;

        if (!measureTooltip) {
          measureTooltip = L.tooltip({ permanent: true, direction: 'top', className: 'parcel-address-label' })
            .setLatLng(e.latlng)
            .addTo(map);
        }
        measureTooltip.setLatLng(e.latlng).setContent(`<b>Distance:</b> ${labelText}`);
      }
    });

    map.on('dblclick', function () {

    const ResetViewControl = L.Control.extend({

    async function performAddressSearch(query) {
      const bounds = map.getBounds();
      const southWest = bounds.getSouthWest();
      const northEast = bounds.getNorthEast();
      const center = map.getCenter();

      const viewbox = `${southWest.lng},${southWest.lat},${northEast.lng},${northEast.lat}`;
      const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=us&lat=${center.lat}&lon=${center.lng}&viewbox=${viewbox}&bounded=0&q=${encodeURIComponent(query)}&limit=10`;

      try {
        const response = await fetch(url, { 
          headers: { 
            'Accept-Language': 'en',
            'User-Agent': 'MAPPED-Editor-App/1.0'
          } 
        });
        const results = await response.json();

        const allowedStates = [
          "Wisconsin", "Minnesota", "Iowa", "Illinois", "Michigan", "Indiana"
        ];

        const filteredResults = results.filter(result => {
          const state = result.address && result.address.state;
          return state && allowedStates.some(allowed => 
            state.toLowerCase() === allowed.toLowerCase()
          );
        });

        if (filteredResults.length === 0) {
          searchResults.innerHTML = `<div class="search-result-item" style="color: #777;">No addresses found in allowed states</div>`;
          searchResults.style.display = "block";
          return;
        }

        searchResults.innerHTML = "";
        filteredResults.forEach(result => {
          const item = document.createElement("div");
          item.className = "search-result-item";
          item.innerText = result.display_name;
          item.onclick = () => selectSearchResult(result);
          searchResults.appendChild(item);
        });
        searchResults.style.display = "block";
      } catch (err) {
        console.error("Search failed:", err);
      }
    }

    function selectSearchResult(result) {
      const lat = parseFloat(result.lat);
      const lon = parseFloat(result.lon);
      searchResults.style.display = "none";
      if (searchInput) searchInput.value = result.display_name.split(',')[0];
      map.setView([lat, lon], 17);

      if (searchResultMarker) map.removeLayer(searchResultMarker);

      searchResultMarker = L.marker([lat, lon], { icon: markerIcons.purple })
        .addTo(map)
        .bindPopup(`<b>Search Location</b><br>${result.display_name}`, { closeButton: false })
        .openPopup();
    }

    // REAL-TIME FIRESTORE SYNC
    db.collection("marshfield_pins").onSnapshot(function(snapshot) {
      var statusDot = document.getElementById("status-dot");
      if (statusDot) statusDot.classList.add("online");

      snapshot.docChanges().forEach(function(change) {
        var id = change.doc.id;
        var data = change.doc.data();

        if (change.type === "added" || change.type === "modified") {
          renderPinMarker(id, data);
        }
        if (change.type === "removed" && activeMarkers[id]) {
          markerClusterGroup.removeLayer(activeMarkers[id].marker);
          delete activeMarkers[id];
        }
      });
    }, function(error) {
      console.error("Firestore sync error:", error);
    });

    function renderPinMarker(id, data) {
      var currentUser = auth.currentUser;
      var isOwner = currentUser && data.userId === currentUser.uid;
      var isSuperAdmin = typeof currentUserProfile !== 'undefined' && currentUserProfile && currentUserProfile.role === "super_admin";
      
      var pinLat = data.lat ?? data.latitude;
      var pinLng = data.lng ?? data.longitude;
      var isGeofenceAllowed = typeof isWithinAllowedGeofences === 'function' && isWithinAllowedGeofences(pinLat, pinLng);
      
      var canEditPin = currentUser && (isOwner || isSuperAdmin || isGeofenceAllowed);

      var pinColor = data.color && markerIcons[data.color] ? data.color : 'purple';
      var chosenIcon = markerIcons[pinColor];
      var isDraggable = !!canEditPin;

      var entry = activeMarkers[id];

      if (!entry) {
        var marker = L.marker([pinLat, pinLng], { 
          icon: chosenIcon,
          draggable: isDraggable
        });

        marker.on('dragstart', function() {
          markerClusterGroup.removeLayer(marker);
          marker.addTo(map);
        });

        marker.on('dragend', async function(e) {
          var newLatLng = e.target.getLatLng();
          map.removeLayer(marker);
          markerClusterGroup.addLayer(marker);

          if (!isWithinAllowedGeofences(newLatLng.lat, newLatLng.lng)) {
            alert("Action blocked: This location is outside your allowed editing geofence.");
            e.target.setLatLng([pinLat, pinLng]);
            return;
          }

          try {
            await db.collection("marshfield_pins").doc(id).update({
              lat: newLatLng.lat,
              lng: newLatLng.lng,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          } catch (err) {
            alert("Error updating position: " + err.message);
            e.target.setLatLng([pinLat, pinLng]);
          }
        });

        entry = { marker: marker, data: data };
        activeMarkers[id] = entry;
        markerClusterGroup.addLayer(marker);
      } else {
        entry.data = data;
        entry.marker.setIcon(chosenIcon);
        entry.marker.setLatLng([pinLat, pinLng]);
      }

      if (entry.marker.dragging) {
        isDraggable ? entry.marker.dragging.enable() : entry.marker.dragging.disable();
      }

      var images = data.imageUrls || (data.imageUrl ? [data.imageUrl] : []);
      var imageGalleryHtml = "";
      if (images.length > 0) {
        imageGalleryHtml = '<div class="image-gallery">' + 
          images.map(function(url, idx) {
            var deleteBtn = canEditPin ? '<button type="button" class="delete-img-btn" onclick="removePinImage(\'' + id + '\',' + idx + ')" title="Remove photo">✕</button>' : '';
            return '<div class="image-thumb-container"><a href="' + url + '" target="_blank"><img src="' + url + '" alt="photo"></a>' + deleteBtn + '</div>';
          }).join('') + '</div>';
      }

      var editDeleteBtns = canEditPin ? '<div class="pin-actions"><button onclick="openEditModal(\'' + id + '\')">Edit Pin</button><button onclick="deletePin(\'' + id + '\')">Delete Pin</button></div>' : '';
      var popupContent = '<div class="pin-popup"><h3>' + (data.title || 'Marshfield Pin') + '</h3><p>' + (data.description || data.note || '') + '</p>' + imageGalleryHtml + editDeleteBtns + '</div>';
      entry.marker.bindPopup(popupContent);

      var tooltipTitle = data.title && data.title.trim() !== '' ? data.title : 'Untitled Pin';
      if (entry.marker.getTooltip()) {
        entry.marker.setTooltipContent(tooltipTitle);
      } else {
        entry.marker.bindTooltip(tooltipTitle, { direction: 'top', offset: [0, -40], opacity: 0.9 });
      }

      var checkedColors = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(function(cb) { return cb.value; });
      if (checkedColors.includes(pinColor)) {
        if (!markerClusterGroup.hasLayer(entry.marker)) markerClusterGroup.addLayer(entry.marker);
      } else {
        if (markerClusterGroup.hasLayer(entry.marker)) {
          entry.marker.closePopup();
          markerClusterGroup.removeLayer(entry.marker);
        }
      }
    }

    window.openEditModal = function(id) {
      const entry = activeMarkers[id];
      if (!entry || !entry.data) {

        return;

      if (noteField) noteField.value = pinData.note || pinData.description || "";

            </div>

        }

      const fileInput = document.getElementById("edit-file-input");

    window.savePinEdits = async function() {
      const idField = document.getElementById("edit-pin-id");
      const titleField = document.getElementById("edit-title");
      const noteField = document.getElementById("edit-note");
      const colorField = document.getElementById("edit-color");
      const fileInput = document.getElementById("edit-file-input");

      if (!idField || !titleField || !noteField) return;

      const id = idField.value;
      const title = titleField.value.trim();
      const note = noteField.value.trim();
      const color = colorField ? colorField.value : "purple";

      if (!id) return;

      try {
        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          await window.uploadPhotos(id, fileInput.files);
        }

        await db.collection("marshfield_pins").doc(id).update({
          title: title,
          note: note,
          description: note,
          color: color,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        const modal = document.getElementById("edit-modal");
        if (modal) modal.style.display = "none";
      } catch (err) {
        alert("Error updating pin: " + err.message);
      }
    };

    window.deletePin = async function(id) {
      if (!confirm("Are you sure you want to delete this pin?")) return;
      try {
        await db.collection("marshfield_pins").doc(id).delete();
      } catch (err) {
        alert("Error deleting pin: " + err.message);
      }
    };

    window.uploadPhotos = async function(pinId, files) {
      if (!files || files.length === 0) return;

      const statusEl = document.getElementById(`upload-status-${pinId}`) || document.getElementById("upload-status-modal");
      if (statusEl) {
        statusEl.style.display = "block";
        statusEl.innerText = `Uploading ${files.length} image(s)...`;
      }

      try {
        const uploadedUrls = [];

        for (let file of files) {
          if (file.size > 10 * 1024 * 1024) continue;

          const fileRef = storage.ref().child(`pins/${pinId}/${Date.now()}_${file.name}`);
          const snapshot = await fileRef.put(file);
          const downloadUrl = await snapshot.ref.getDownloadURL();
          uploadedUrls.push(downloadUrl);
        }

        if (uploadedUrls.length > 0) {
          const docRef = db.collection("marshfield_pins").doc(pinId);
          const docSnap = await docRef.get();
          const existingData = docSnap.data();
          const currentUrls = existingData.imageUrls || (existingData.imageUrl ? [existingData.imageUrl] : []);

          await docRef.update({
            imageUrls: [...currentUrls, ...uploadedUrls],
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      } catch (err) {
        alert("Photo upload failed: " + err.message);
      } finally {
        if (statusEl) statusEl.style.display = "none";
      }
    };

    window.removePinImage = async function(pinId, indexToRemove) {
      if (!confirm("Remove this photo?")) return;
      try {
        const docRef = db.collection("marshfield_pins").doc(pinId);
        const docSnap = await docRef.get();
        const data = docSnap.data();
        let urls = data.imageUrls || (data.imageUrl ? [data.imageUrl] : []);

        urls.splice(indexToRemove, 1);

        await docRef.update({
          imageUrls: urls,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        alert("Error removing image: " + err.message);
      }
    };

    window.addNewUserLocation = async function() {
      if (!currentUser) {
        alert("You must be logged in to save locations.");
        return;
      }

      const name = prompt("Enter a name for this location:");
      if (!name || name.trim() === "") return;

      const center = map.getCenter();

      try {
        const userRef = db.collection("users").doc(currentUser.uid);
        const newLocation = {
          name: name.trim(),
          location: new firebase.firestore.GeoPoint(center.lat, center.lng),
          radiusMeters: null 
        };

        await userRef.update({
          allowedGeofences: firebase.firestore.FieldValue.arrayUnion(newLocation)
        });

        if (!currentUserProfile.allowedGeofences) {
          currentUserProfile.allowedGeofences = [];
        }
        currentUserProfile.allowedGeofences.push(newLocation);
        
        updateZonesPanelUI();
        alert(`Successfully saved "${name}"!`);
      } catch (err) {
        alert("Error saving location: " + err.message);
      }
    };
	
    window.removeUserLocation = async function(index) {
      if (!currentUser || !currentUserProfile || !currentUserProfile.allowedGeofences) return;
      
      const zoneName = currentUserProfile.allowedGeofences[index]?.name || "this location";
      if (!confirm(`Remove "${zoneName}" from your saved locations?`)) return;

      try {
        const userRef = db.collection("users").doc(currentUser.uid);
        const updatedZones = [...currentUserProfile.allowedGeofences];
        updatedZones.splice(index, 1);

        await userRef.update({
          allowedGeofences: updatedZones
        });

        currentUserProfile.allowedGeofences = updatedZones;
        updateZonesPanelUI();
      } catch (err) {
        alert("Error removing location: " + err.message);
      }
    };
	
    async function renameUserLocation(index, currentName) {
      const newName = prompt("Rename location:", currentName);
      if (!newName || newName.trim() === "" || newName === currentName) return;

      const trimmedName = newName.trim();

      if (currentUserProfile && currentUserProfile.allowedGeofences) {
        currentUserProfile.allowedGeofences[index].name = trimmedName;
      }

      try {
        const userRef = db.collection("users").doc(auth.currentUser.uid);
        await userRef.update({
          allowedGeofences: currentUserProfile.allowedGeofences
        });
        updateZonesPanelUI();
      } catch (err) {
        console.error("Failed to rename location:", err);
        alert("Could not save the new name. Please try again.");
      }
    }

    function updateZonesPanelUI() {
      const zonesPanel = document.getElementById("zones-panel");
      const zonesList = document.getElementById("zones-list");
      if (!zonesList) return;
      geofenceLayerGroup.clearLayers();

      const userZones = currentUserProfile?.allowedGeofences;

      if (userZones && userZones.length > 0) {
        zonesList.innerHTML = "";
        
        userZones.forEach((zone, index) => {
          const loc = zone.location || zone.geopoint || zone.coords || zone.point || zone;
          const lat = loc.latitude ?? loc.lat;
          const lng = loc.longitude ?? loc.lng;
          const radius = zone.radiusMeters || zone.radius;
          const name = zone.name || `Location ${index + 1}`;

          if (lat != null && lng != null) {
            const row = document.createElement("div");
            row.className = "zone-row";

            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "zone-btn";
            btn.innerHTML = `<span>📍 ${name}</span>`;
            btn.onclick = () => jumpToZone(lat, lng);

            const renameBtn = document.createElement("button");
            renameBtn.type = "button";
            renameBtn.className = "zone-rename-btn";
            renameBtn.innerHTML = "✏️";
            renameBtn.title = "Rename location";
            renameBtn.style.background = "none";
            renameBtn.style.border = "none";
            renameBtn.style.cursor = "pointer";
            renameBtn.style.padding = "0 4px";
            renameBtn.onclick = (e) => {
              e.stopPropagation();
              renameUserLocation(index, name);
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "zone-delete-btn";
            deleteBtn.innerHTML = "✕";
            deleteBtn.title = "Remove location";
            deleteBtn.onclick = () => removeUserLocation(index);

            row.appendChild(btn);
            row.appendChild(renameBtn);
            row.appendChild(deleteBtn);
            zonesList.appendChild(row);

            if (radius != null && radius > 0) {
              L.circle([lat, lng], {
                radius: radius,
                color: '#3498db',
                fillColor: '#3498db',
                fillOpacity: 0.1,
                weight: 2
              }).bindTooltip(name).addTo(geofenceLayerGroup);
            }
          }
        });

        zonesPanel.style.display = "block";
      } else {
        zonesList.innerHTML = `<div style="font-size:11px; color:#777; text-align:center; padding:4px;">No saved locations</div>`;
        zonesPanel.style.display = currentUser ? "block" : "none"; 
      }
    }

    window.jumpToZone = function(lat, lng) {
      map.flyTo([lat, lng], 15, { duration: 1.5 });
    };

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      const authBtn = document.getElementById("auth-btn");
      if (authBtn) {
        authBtn.innerText = user ? "Account" : "Login";
        authBtn.onclick = user ? window.openAccountMenuModal : window.openLoginChoiceModal;
      }

      if (user) {
        try {
          const userDoc = await db.collection("users").doc(user.uid).get();
          if (userDoc.exists) {
            currentUserProfile = userDoc.data();
            updateZonesPanelUI();

            const firstZone = currentUserProfile.allowedGeofences?.[0];
            if (firstZone) {
              const loc = firstZone.location || firstZone.geopoint || firstZone.coords || firstZone.point || firstZone;
              const lat = loc.latitude ?? loc.lat;
              const lng = loc.longitude ?? loc.lng;
              if (lat != null && lng != null) {
                map.flyTo([lat, lng], 15, { duration: 1.5 });
              }
            }
          } else {
            currentUserProfile = null;
            updateZonesPanelUI();
          }
        } catch (err) {
          console.error("Error fetching user profile:", err);
          currentUserProfile = null;
          updateZonesPanelUI();
        }
      } else {
        currentUserProfile = null;
        updateZonesPanelUI();
      }

      Object.keys(activeMarkers).forEach(id => {
        const { marker, data } = activeMarkers[id];
        renderPinMarker(id, data);
      });
    });

    async function logoutUser() { 
      secureEsriLayers.forEach(layer => {
        map.removeLayer(layer);
      });
      secureEsriLayers = [];

      if (typeof arcgisLayerControl !== 'undefined' && arcgisLayerControl) {
        map.removeControl(arcgisLayerControl);
        arcgisLayerControl = null;
      }

      const arcDot = document.getElementById("arcgis-status-dot");
      if (arcDot) arcDot.style.backgroundColor = "#f39c12";

      await auth.signOut(); 
    }

    async function loginUser() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();
      const rememberMe = document.getElementById("login-remember").checked;

      if (!email || !password) return alert("Enter email and password.");

      try {
        const persistence = rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
        await auth.setPersistence(persistence);
        await auth.signInWithEmailAndPassword(email, password);
        closeLoginModal();
      } catch (err) {
        alert("Login failed: " + err.message);
      }
    }

    window.toggleZonesPanel = function() {
      const panel = document.getElementById("zones-panel");
      panel.classList.toggle("collapsed");
    };

    async function forgotPassword() {
      const emailInput = document.getElementById("login-email");
      let email = emailInput.value.trim();

      if (!email) {
        email = prompt("Please enter your account email address for password reset:");
        if (!email) return;
      }

      try {
        await auth.sendPasswordResetEmail(email);
        alert("Password reset email sent! Check your inbox.");
      } catch (err) {
        alert("Error sending password reset email: " + err.message);
      }
    }

    // CITY ARCGIS AUTH & SECURE DYNAMIC LAYERS (High Performance & Flawless Culling)
    async function generateArcGISToken() {
      const username = document.getElementById("arcgis-user").value.trim();
      const password = document.getElementById("arcgis-pass").value.trim();

      if (!username || !password) {
        alert("Please enter both username and password.");
        return;
      }

      const tokenUrl = "https://www.arcgis.com/sharing/rest/generateToken";

      const params = new URLSearchParams();
      params.append("username", username);
      params.append("password", password);
      params.append("client", "referer");
      params.append("referer", window.location.origin);
      params.append("expiration", 60);
      params.append("f", "json");

      try {
        const response = await fetch(tokenUrl, {
          method: "POST",
          body: params
        });

        const data = await response.json();

        if (data.error) {
          alert("Login failed: " + data.error.message);
          return;
        }

        const token = data.token;
        closeArcGISLoginModal();

        secureEsriLayers.forEach(layer => map.removeLayer(layer));
        secureEsriLayers = [];

        if (arcgisLayerControl) {
          map.removeControl(arcgisLayerControl);
        }

        loadArcGISLayers(token);

      } catch (err) {
        alert("Connection error connecting to ArcGIS server: " + err.message);
      }
    }

    function loadArcGISLayers(token) {
      const utilityOverlays = {};

      myBaseServices.forEach(service => {
        // High-performance server-rendered dynamic map layers with automatic zoom culling
        const dynamicLayer = L.esri.dynamicMapLayer({
          url: service.url,
          token: token,
          opacity: 0.85,
          format: "png24",
          minZoom: 16 // Automatically hides completely when zoomed out, eliminating all lag
        });

        secureEsriLayers.push(dynamicLayer);
        utilityOverlays[`🔒 ${service.name}`] = dynamicLayer;
      });

      if (arcgisLayerControl) {
        map.removeControl(arcgisLayerControl);
      }

      arcgisLayerControl = L.control.layers(null, utilityOverlays, { 
        position: 'topright', 
        collapsed: true 
      }).addTo(map);

      const arcDot = document.getElementById("arcgis-status-dot");
      if (arcDot) arcDot.style.backgroundColor = "#2ecc71";

      alert("City ArcGIS secure utility layers loaded successfully! They will appear automatically when you zoom in close.");
    }

    // LAZY-LOADED KMZ FIBER LAYERS
    const kmzLayersCache = {
      pbd03: null,
      pbd07: null,
      pbd09: null
    };

    const kmzFilePaths = {
      pbd03: './' + encodeURI('Wausau PBD03.kmz'),
      pbd07: './KMZs/PBD07.kmz',
      pbd09: './KMZs/PBD09.kmz'
    };

    const kmzPanel = document.getElementById('kmz-legend-panel');
    L.DomEvent.disableClickPropagation(kmzPanel);
    L.DomEvent.disableScrollPropagation(kmzPanel);

    function toggleKmzLayers() {
      const checkboxes = document.querySelectorAll('.kmz-checkbox');
      checkboxes.forEach(cb => {
        const layerKey = cb.getAttribute('data-layer');
        
        if (cb.checked) {
          if (!kmzLayersCache[layerKey]) {
            const targetLayer = L.kmzLayer();
            targetLayer.load(kmzFilePaths[layerKey]);
            kmzLayersCache[layerKey] = targetLayer;
            targetLayer.addTo(map);
          } else {
            if (!map.hasLayer(kmzLayersCache[layerKey])) {
              map.addLayer(kmzLayersCache[layerKey]);
            }
          }
        } else {
          if (kmzLayersCache[layerKey] && map.hasLayer(kmzLayersCache[layerKey])) {
            map.removeLayer(kmzLayersCache[layerKey]);
          }
        }
      });
    }

    function toggleKmzCollapse() {
      const content = document.getElementById('kmz-legend-content');
      const title = document.getElementById('kmz-legend-title');
      if (content.style.display === 'none') {
        content.style.display = 'block';
        title.innerHTML = 'Fiber ▾';
      } else {
        content.style.display = 'none';
        title.innerHTML = 'Fiber ▸';
      }
    }

    function toggleAllKmz() {
      const checkboxes = document.querySelectorAll('.kmz-checkbox');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
      });
      toggleKmzLayers();
    }
  </script>
